; PlatformIO Project Configuration File
; MQ Sentinel - ENGG2000 Space Debris Cleanup Challenge
;
; Board confirmed: Nano ATmega328 with NEW bootloader @ 115200 baud
; (confirmed working via connection_test upload)
;
; Build environments, one shared board config:
;   nanoatmega328   -> full system (src/main.cpp) - needs real IR sensors wired
;   motor_test      -> motor + encoder calibration (src/motor_test_main.cpp)
;   mock_button     -> full state machine w/ pushbutton standing in for IR beacon
;                      (src/mock_button_main.cpp)
;   motor_onoff     -> simple motor ON/OFF spin test (src/motor_onoff_main.cpp)
;   connection_test -> Nano<->motor wiring check via encoder feedback
;                      (src/connection_test_main.cpp)
;
; Each environment's build_src_filter includes only the ONE "main" file it
; needs, so only one setup()/loop() pair is compiled at a time.
;
; To build/upload a specific environment from the terminal:
;   pio run -e connection_test -t upload
;   pio run -e motor_onoff -t upload
;   pio run -e motor_test -t upload
;   pio run -e mock_button -t upload
;   pio run -e nanoatmega328 -t upload
;
; To open Serial Monitor for a specific environment:
;   pio device monitor -e connection_test

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
upload_speed = 115200

[env:nanoatmega328]
build_src_filter = +<*> -<motor_test_main.cpp> -<mock_button_main.cpp> -<motor_onoff_main.cpp> -<connection_test_main.cpp> -<motor_sequence_main.cpp>

[env:motor_test]
build_src_filter = +<*> -<main.cpp> -<mock_button_main.cpp> -<motor_onoff_main.cpp> -<connection_test_main.cpp> -<motor_sequence_main.cpp>

[env:mock_button]
build_src_filter = +<*> -<main.cpp> -<motor_test_main.cpp> -<motor_onoff_main.cpp> -<connection_test_main.cpp> -<motor_sequence_main.cpp>

[env:motor_onoff]
build_src_filter = +<motor_onoff_main.cpp>

[env:motor_sequence]
build_src_filter = +<motor_sequence_main.cpp>

[env:connection_test]
build_src_filter = +<connection_test_main.cpp>
