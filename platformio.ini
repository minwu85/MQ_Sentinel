; PlatformIO Project Configuration File
; MQ Sentinel - ENGG2000 Space Debris Cleanup Challenge
;
; Three build environments, one shared board config:
;   nanoatmega328  -> full system (src/main.cpp) - needs real IR sensors wired
;   motor_test     -> motor + encoder calibration only (src/motor_test_main.cpp)
;   mock_button    -> full state machine w/ pushbutton standing in for IR beacon
;                     (src/mock_button_main.cpp)
;
; Each environment's build_src_filter includes ALL shared subsystem files
; (IRSensor.cpp, MotorControl.cpp, LaserControl.cpp) but excludes the OTHER
; two "main" files, so only one setup()/loop() pair is compiled at a time.
;
; To build/upload a specific environment from the terminal:
;   pio run -e motor_test -t upload
;   pio run -e mock_button -t upload
;   pio run -e nanoatmega328 -t upload
;
; In VS Code: click the PlatformIO icon -> expand the environment you want
; under PROJECT TASKS -> Upload.

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
upload_speed = 57600

; NOTE: Most clone Nanos (with the CH340 USB chip) use the OLD bootloader.
; If upload fails with "avrdude: stk500_recv(): programmer is not responding",
; try adding this line inside whichever [env:...] section is failing:
; board = nanoatmega328new

[env:nanoatmega328]
build_src_filter = +<*> -<motor_test_main.cpp> -<mock_button_main.cpp>

[env:motor_test]
build_src_filter = +<*> -<main.cpp> -<mock_button_main.cpp>

[env:mock_button]
build_src_filter = +<*> -<main.cpp> -<motor_test_main.cpp>
