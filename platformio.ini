; PlatformIO Project Configuration File
; MQ Sentinel - ENGG2000 Space Debris Cleanup Challenge
; Board: Arduino Nano V3 (ATmega328) - REPLACEMENT board after the
; original Nano's auto-reset circuit was found to be faulty.
;
; Four environments only:
;   motor_onoff     -> g=start, space=stop, r=rotate once (alternates
;                      CW/CCW each press) (src/motor_onoff_main.cpp)
;   connection_test -> Nano<->motor wiring check via encoder feedback
;                      (src/connection_test_main.cpp)
;   laser_test      -> laser diode blink test (src/laser_test_main.cpp)
;   reactive_ir     -> motor spins, stops when IR receiver detects a
;                      signal (src/reactive_ir_main.cpp)
;
; IRSensor.cpp/.h are kept in the project (multi-sensor class from the
; original design) but are not wired into any environment yet - they're
; reference/future code for when the full sensor ring is built.
;
; If uploads fail with "stk500_getsync" / "programmer is not responding":
;   1. Check nothing is wired to pins D0/D1 (RX/TX)
;   2. Disconnect any battery power from VIN during upload (USB only)
;   3. Try switching board = nanoatmega328 with upload_speed = 57600
;      below if the new-bootloader setting doesn't work on this board

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
upload_speed = 115200

[env:motor_onoff]
build_src_filter = +<motor_onoff_main.cpp>

[env:connection_test]
build_src_filter = +<connection_test_main.cpp>

[env:laser_test]
build_src_filter = +<laser_test_main.cpp>

[env:reactive_ir]
build_src_filter = +<reactive_ir_main.cpp>

[env:ir_triggered_spin]
build_src_filter = +<ir_triggered_spin_main.cpp>
