; PlatformIO Project Configuration File
; MQ Sentinel - ENGG2000 Space Debris Cleanup Challenge
; Board: Arduino Uno R3
;
; Five environments:
;   motor_control      -> g=start, space=stop, r=reverse direction (src/motor_control_main.cpp)
;   motor_autospin     -> continuous clockwise spin, no PC needed (src/motor_autospin_main.cpp)
;   motor_ir_led       -> motor + IR receiver test with LED indicators (src/motor_ir_led_main.cpp)
;   connectivity       -> pure board<->PC connectivity test, no motor (src/connectivity_main.cpp)
;   ir_transmitter_test -> 38kHz IR beacon transmitter test with visible status LED
;                          (src/ir_transmitter_test_main.cpp)
;
; Each environment builds only its own file - no wildcard/exclude
; filters needed since every file has its own dedicated environment.
;
; Usage:
;   pio run -e motor_control -t upload
;   pio device monitor -e motor_control

[env]
platform = atmelavr
board = uno
framework = arduino

[env:motor_control]
monitor_speed = 9600
build_src_filter = +<motor_control_main.cpp>

[env:motor_autospin]
monitor_speed = 9600
build_src_filter = +<motor_autospin_main.cpp>

[env:motor_ir_led]
monitor_speed = 115200
build_src_filter = +<motor_ir_led_main.cpp>

[env:connectivity]
monitor_speed = 115200
build_src_filter = +<connectivity_main.cpp>

[env:ir_transmitter_test]
monitor_speed = 9600
build_src_filter = +<ir_transmitter_test_main.cpp>
